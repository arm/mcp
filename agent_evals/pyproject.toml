[project]
name = "arm-agent-evals"
version = "0.1.0"
description = "Local agent evaluations for Arm MCP capabilities"
requires-python = ">=3.10"
dependencies = ["jsonschema>=4.20,<5", "tomli>=2; python_version < '3.11'"]

[project.scripts]
arm-agent-evals = "agent_evals.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["agent_evals"]
package-dir = {agent_evals = "."}
include-package-data = false

[tool.setuptools.package-data]
agent_evals = ["scenario.schema.json"]

[tool.setuptools.exclude-package-data]
agent_evals = ["__pycache__/*", "*.pyc"]
