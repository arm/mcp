[project]
name = "arm-mcp-local"
version = "0.1.0"
description = "Runtime dependencies for the Arm MCP server image"
requires-python = "==3.12.*"
dependencies = [
    "fastmcp==3.4.5",
    "flask==3.1.3",
    "gitpython==3.1.57",
    "jinja2==3.1.6",
    "lxml==6.1.1",
    "mcp==1.29.0",
    "numkong==7.7.0",
    "python-magic==0.4.27",
    "pyyaml==6.0.3",
    "rank-bm25==0.2.2",
    "requests==2.34.2",
    "ruamel-yaml==0.19.1",
    "sentence-transformers==5.6.1",
    "torch==2.13.0",
    "usearch==2.26.0",
]

[tool.uv]
package = false
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu", marker = "sys_platform == 'linux'" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
