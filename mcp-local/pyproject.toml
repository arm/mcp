[project]
name = "arm-mcp-local"
version = "0.1.0"
description = "Runtime dependencies for the Arm MCP server image"
requires-python = "==3.12.*"
dependencies = [
    "arm-kb-search",
    "fastmcp==3.4.10",
    # Pin runtime pip explicitly instead of inheriting the venv bootstrap version.
    "pip==26.3",
    "pyyaml==6.0.3",
    "torch==2.14.0",
    "transformers==5.17.0",
]

[dependency-groups]
acquisition = [
    "pip==26.3",
]
test = [
    "fastmcp==3.4.10",
    "mcp==1.30.0",
    "pytest",
    "pyyaml==6.0.3",
    "testcontainers",
]

[tool.uv]
package = false
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.uv.sources]
arm-kb-search = { path = ".." }
torch = { index = "pytorch-cpu", marker = "sys_platform == 'linux'" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
