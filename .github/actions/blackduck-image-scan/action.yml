name: Black Duck Secure Container pre-publish scan
description: Scan a locally built container archive and enforce the release gate

inputs:
  project_name:
    description: Black Duck project receiving the image scan
    required: true
  project_version:
    description: Black Duck project version receiving the image scan
    required: true
  image_reference:
    description: Local image tag produced by the preceding build step
    required: true
  platform:
    description: Expected image platform
    required: true
  artifact_suffix:
    description: Unique suffix for the retained SARIF artifact
    required: true
  blackducksca_url:
    description: Black Duck SCA server URL
    required: true
  blackducksca_token:
    description: Black Duck SCA API token
    required: true
  github_token:
    description: GitHub token used to upload the SARIF report
    required: true

runs:
  using: composite
  steps:
    - name: Prepare Secure Container scan archive
      id: prepare
      shell: bash
      env:
        IMAGE_REFERENCE: ${{ inputs.image_reference }}
        IMAGE_PLATFORM: ${{ inputs.platform }}
        PROJECT_NAME: ${{ inputs.project_name }}
        PROJECT_VERSION: ${{ inputs.project_version }}
        ARTIFACT_SUFFIX: ${{ inputs.artifact_suffix }}
      run: |
        set -euo pipefail
        if [[ ! "${IMAGE_REFERENCE}" =~ ^ghcr\.io/[A-Za-z0-9._/-]+:[A-Za-z0-9._-]+$ ]]; then
          echo "::error::Pre-publish scans require a valid local GHCR image tag."
          exit 1
        fi
        if [[ ! "${IMAGE_PLATFORM}" =~ ^linux/(amd64|arm64)$ ]]; then
          echo "::error::Unsupported image platform: ${IMAGE_PLATFORM}"
          exit 1
        fi
        if [[ ! "${ARTIFACT_SUFFIX}" =~ ^[A-Za-z0-9._-]+$ ]]; then
          echo "::error::Artifact suffix contains unsupported characters."
          exit 1
        fi

        actual_platform="$(docker image inspect \
          --format '{{.Os}}/{{.Architecture}}' "${IMAGE_REFERENCE}")"
        if [[ "${actual_platform}" != "${IMAGE_PLATFORM}" ]]; then
          echo "::error::Expected ${IMAGE_PLATFORM}, built ${actual_platform}."
          exit 1
        fi

        archive_path="${RUNNER_TEMP}/blackduck-container-${ARTIFACT_SUFFIX}.tar"
        docker image save --output "${archive_path}" "${IMAGE_REFERENCE}"
        if [[ ! -s "${archive_path}" ]]; then
          echo "::error::Secure Container scan archive is empty."
          exit 1
        fi
        printf 'archive_path=%s\n' "${archive_path}" >> "${GITHUB_OUTPUT}"

    - name: Show Black Duck image target
      shell: bash
      env:
        PROJECT_NAME: ${{ inputs.project_name }}
        PROJECT_VERSION: ${{ inputs.project_version }}
        IMAGE_REFERENCE: ${{ inputs.image_reference }}
        IMAGE_PLATFORM: ${{ inputs.platform }}
      run: |
        set -euo pipefail
        echo "::notice title=Black Duck pre-publish target::${PROJECT_NAME} / ${PROJECT_VERSION} / ${IMAGE_REFERENCE} / ${IMAGE_PLATFORM}"

    - name: Black Duck SCA Secure Container scan
      id: scan
      continue-on-error: true
      uses: blackduck-inc/black-duck-security-scan@152247222aa9cd38124acd5c0cf60f4db71adc3f # v2.11.0
      env:
        DETECT_PROJECT_NAME: ${{ inputs.project_name }}
        DETECT_PROJECT_VERSION_NAME: ${{ inputs.project_version }}
      with:
        blackducksca_url: ${{ inputs.blackducksca_url }}
        blackducksca_token: ${{ inputs.blackducksca_token }}
        blackducksca_scan_full: true
        blackducksca_scan_failure_severities: 'BLOCKER,CRITICAL'
        blackducksca_waitForScan: true
        detect_args: >-
          --detect.accuracy.required=NONE
          --detect.tools=CONTAINER_SCAN
          --detect.container.scan.file.path=${{ steps.prepare.outputs.archive_path }}
          --detect.blackduck.scan.wait.for.results.timeout=1800
        blackducksca_reports_sarif_create: true
        blackducksca_reports_sarif_file_path: blackduck-results-${{ inputs.artifact_suffix }}.sarif
        blackducksca_reports_sarif_severities: 'Critical,High,Medium,Low'
        blackducksca_reports_sarif_groupSCAIssues: false
        blackducksca_upload_sarif_report: true
        github_token: ${{ inputs.github_token }}
        mark_build_status: 'failure'
        include_diagnostics: true

    - name: Remove Secure Container scan archive
      if: ${{ always() }}
      shell: bash
      env:
        CONTAINER_ARCHIVE: ${{ steps.prepare.outputs.archive_path }}
      run: |
        set -euo pipefail
        if [[ -n "${CONTAINER_ARCHIVE}" ]]; then
          rm -f -- "${CONTAINER_ARCHIVE}"
        fi

    - name: Retain Black Duck SARIF
      if: ${{ always() }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: blackduck-${{ inputs.artifact_suffix }}
        path: blackduck-results-${{ inputs.artifact_suffix }}.sarif
        if-no-files-found: warn
        retention-days: 10

    - name: Write Black Duck scan summary
      if: ${{ always() }}
      shell: bash
      env:
        PROJECT_NAME: ${{ inputs.project_name }}
        PROJECT_VERSION: ${{ inputs.project_version }}
        IMAGE_REFERENCE: ${{ inputs.image_reference }}
        IMAGE_PLATFORM: ${{ inputs.platform }}
        SCAN_OUTCOME: ${{ steps.scan.outcome }}
        SCAN_STATUS: ${{ steps.scan.outputs.status }}
      run: |
        set -euo pipefail
        if [[ "${SCAN_OUTCOME}" == "success" ]]; then
          scan_result="passed"
        elif [[ "${SCAN_STATUS}" == "8" ]]; then
          scan_result="policy violation"
        else
          scan_result="container scan error"
        fi
        {
          echo "### Black Duck Secure Container pre-publish scan"
          echo ""
          printf -- '- Project: `%s`\n' "${PROJECT_NAME}"
          printf -- '- Version: `%s`\n' "${PROJECT_VERSION}"
          printf -- '- Local image: `%s`\n' "${IMAGE_REFERENCE}"
          printf -- '- Platform: `%s`\n' "${IMAGE_PLATFORM}"
          echo '- Scan engine: `CONTAINER_SCAN`'
          echo '- Release gate: `BLOCKER,CRITICAL`'
          printf -- '- Scan outcome: `%s`\n' "${SCAN_OUTCOME}"
          printf -- '- Bridge exit status: `%s`\n' "${SCAN_STATUS:-unavailable}"
          printf -- '- Result classification: `%s`\n' "${scan_result}"
          echo '- Publication occurs only after this scan succeeds.'
          echo '- SARIF retention: workflow artifact for 10 days'
        } >> "${GITHUB_STEP_SUMMARY}"

    - name: Report Black Duck policy violation
      if: ${{ always() && steps.scan.outcome != 'success' && steps.scan.outputs.status == '8' }}
      shell: bash
      run: |
        echo "::error title=Black Duck policy violation::The container scan completed, but a BLOCKER/CRITICAL policy violation failed the release gate (Bridge exit code 8)."
        exit 1

    - name: Report Black Duck container scan failure
      if: ${{ always() && steps.scan.outcome != 'success' && steps.scan.outputs.status != '8' }}
      shell: bash
      env:
        SCAN_OUTCOME: ${{ steps.scan.outcome }}
        SCAN_STATUS: ${{ steps.scan.outputs.status }}
      run: |
        echo "::error title=Black Duck container scan failure::The scan or its integration failed (outcome=${SCAN_OUTCOME}, Bridge exit code=${SCAN_STATUS:-unavailable}). Review the retained diagnostics for the underlying error."
        exit 1
