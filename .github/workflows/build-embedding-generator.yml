name: Build Embedding Generator Image

on:
  workflow_dispatch:
    
  # Temporary: workflow_dispatch is unavailable until this workflow exists on
  # the default branch. Remove this trigger after publishing the PR's image.
  push:
    branches: [stestol-571-offline-generator]

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/mcp-embedding-generator
  PACKAGE_NAME: mcp-embedding-generator

jobs:
  build-generator:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Verify GHCR package is private
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          visibility="$(gh api \
            "/orgs/${{ github.repository_owner }}/packages/container/${PACKAGE_NAME}" \
            --jq .visibility)"

          if [ "${visibility}" != "private" ]; then
            echo "::error::Refusing to publish because ${IMAGE} is ${visibility}, not private."
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push generator image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: embedding-generation
          file: embedding-generation/Dockerfile.generator
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:git-${{ github.sha }}-run-${{ github.run_id }}-${{ github.run_attempt }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.title=Arm MCP embedding generator

      - name: Record published digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAG: ${{ env.IMAGE }}:git-${{ github.sha }}-run-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          {
            echo "### Embedding generator image"
            echo ""
            echo "- Tag: \`${TAG}\`"
            echo "- Immutable reference: \`${IMAGE}@${DIGEST}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
