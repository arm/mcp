name: Build Embedding Generator Image

on:
  workflow_dispatch:
  pull_request:
    branches: [secure-build]
    paths:
      - "embedding-generation/Dockerfile.generator"
      - "embedding-generation/.dockerignore"
      - "embedding-generation/.python-version"
      - "embedding-generation/pyproject.toml"
      - "embedding-generation/uv.lock"
      - "embedding-generation/embedding-model.lock.json"
      - "embedding-generation/acquire-model.py"
      - "embedding-generation/document_chunking.py"
      - "embedding-generation/generate-chunks.py"
      - "embedding-generation/local_vectorstore_creation.py"
      - ".github/workflows/build-embedding-generator.yml"

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/mcp-embedding-generator
  PACKAGE_NAME: mcp-embedding-generator
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  build-generator:
    # A pull request from the same repository may publish a private candidate
    # image. Never give a fork pull request a path to the package write token.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # For pull_request, build the reviewed branch commit rather than the
          # temporary merge commit synthesized by GitHub.
          ref: ${{ env.SOURCE_SHA }}

      # arm/mcp is public. Fail closed instead of allowing a newly created GHCR
      # package to inherit public visibility from the repository. Bootstrap the
      # package as private once, then grant this repository Actions write access.
      - name: Verify that the GHCR package is private
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! visibility="$(gh api \
            "/orgs/${{ github.repository_owner }}/packages/container/${PACKAGE_NAME}" \
            --jq .visibility)"; then
            echo "::error::${IMAGE} must already exist as a private package and grant this repository Actions access."
            exit 1
          fi

          if [ "${visibility}" != "private" ]; then
            echo "::error::Refusing to push because ${IMAGE} is ${visibility}, not private."
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push generator image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: embedding-generation
          file: embedding-generation/Dockerfile.generator
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:git-${{ env.SOURCE_SHA }}-run-${{ github.run_id }}-${{ github.run_attempt }}
          labels: |
            org.opencontainers.image.revision=${{ env.SOURCE_SHA }}
            org.opencontainers.image.title=Arm MCP embedding generator

      - name: Record published digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAG: ${{ env.IMAGE }}:git-${{ env.SOURCE_SHA }}-run-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          {
            echo "### Embedding generator image"
            echo ""
            echo "- Tag: \`${TAG}\`"
            echo "- Immutable reference: \`${IMAGE}@${DIGEST}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
