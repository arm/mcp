name: Verify GitHub App credentials

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify promotion GitHub App credentials
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check credential configuration is present
        env:
          GH_APP_CLIENT_ID: ${{ vars.GH_APP_ID }}
          GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${GH_APP_CLIENT_ID}" ]]; then
            echo "::error title=Missing GitHub App client ID::Repository variable GH_APP_ID is not set."
            exit 1
          fi
          if [[ -z "${GH_APP_PRIVATE_KEY}" ]]; then
            echo "::error title=Missing GitHub App private key::Repository secret GH_APP_TOKEN is not set."
            exit 1
          fi
          echo "::notice title=GitHub App configuration::GH_APP_ID and GH_APP_TOKEN are configured."

      - name: Create least-privilege GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_TOKEN }}
          permission-contents: write
          permission-metadata: read
          permission-pull-requests: write

      - name: Verify installation token can access this repository
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          INSTALLATION_ID: ${{ steps.app-token.outputs.installation-id }}
        run: |
          set -euo pipefail
          echo "::notice title=GitHub App token created::App ${APP_SLUG} created installation token ${INSTALLATION_ID}."
          repository="$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.full_name')"
          if [[ "${repository}" != "${GITHUB_REPOSITORY}" ]]; then
            echo "::error title=Unexpected repository access::Expected ${GITHUB_REPOSITORY}, got ${repository}."
            exit 1
          fi
          echo "::notice title=GitHub App repository access verified::Installation token can access ${repository}."
