name: Build MCP Input Bundle

on:
  workflow_dispatch:
  push:
    tags:
      - "mcp-inputs-*"

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/mcp-build-inputs
  PACKAGE_NAME: mcp-build-inputs
  PUBLICATION_TAG: git-${{ github.sha }}-run-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  acquire-and-publish-architecture:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            arch: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Set up locked uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.10.2"
          enable-cache: false

      - name: Verify Python dependency locks
        shell: bash
        run: |
          set -euo pipefail
          expected_uv="$(jq -er '.generated_with.uv' mcp-local/build-inputs.lock.json)"
          actual_uv="$(uv --version | awk '{print $2}')"
          test "${actual_uv}" = "${expected_uv}"
          uv lock --directory mcp-local --check
          uv export \
            --directory mcp-local \
            --locked \
            --no-dev \
            --no-emit-project \
            --format requirements-txt \
            --no-header \
            --output-file /tmp/requirements.lock
          tail -n +3 mcp-local/requirements.lock > /tmp/checked-in-requirements.lock
          cmp /tmp/requirements.lock /tmp/checked-in-requirements.lock

      - name: Install the locked acquisition tool
        shell: bash
        run: |
          set -euo pipefail
          pip_version="$(jq -er '.generated_with.pip' mcp-local/build-inputs.lock.json)"
          python -m pip install --disable-pip-version-check "pip==${pip_version}"
          python -m pip --version

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Verify existing package is private
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/verify-ghcr-package-private.sh "${PACKAGE_NAME}" --allow-missing

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      # This is the only network-capable input phase. Every byte published in
      # the artifact is checked against a dependency or build-input lock.
      - name: Acquire and verify locked inputs
        run: python3 mcp-local/scripts/stage-build-inputs.py --arch ${{ matrix.arch }}

      - name: Publish architecture input image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: mcp-local
          file: mcp-local/Dockerfile.inputs
          target: inputs
          platforms: ${{ matrix.platform }}
          no-cache: true
          push: true
          tags: ${{ env.IMAGE }}:${{ env.PUBLICATION_TAG }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.title=Arm MCP immutable build inputs

  publish-index:
    needs: acquire-and-publish-architecture
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Publish multi-architecture index
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "${IMAGE}:${PUBLICATION_TAG}" \
            "${IMAGE}:${PUBLICATION_TAG}-amd64" \
            "${IMAGE}:${PUBLICATION_TAG}-arm64"

      - name: Verify published package is private
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/verify-ghcr-package-private.sh "${PACKAGE_NAME}"

      - name: Record immutable input reference
        shell: bash
        run: |
          set -euo pipefail
          manifest="$(docker buildx imagetools inspect \
            "${IMAGE}:${PUBLICATION_TAG}" --format '{{json .Manifest}}')"
          digest="$(jq -er '.digest' <<<"${manifest}")"
          if [[ ! "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Published index did not return a valid sha256 digest."
            exit 1
          fi

          {
            echo "### Immutable MCP build-input artifact"
            echo ""
            echo "- Tag: \`${IMAGE}:${PUBLICATION_TAG}\`"
            echo "- Digest: \`${digest}\`"
            echo "- MCP build input: \`${IMAGE}@${digest}\`"
            echo ""
            echo "Record this digest in \`mcp-local/build-inputs.lock.json\` before the release workflow consumes it."
          } >> "${GITHUB_STEP_SUMMARY}"
