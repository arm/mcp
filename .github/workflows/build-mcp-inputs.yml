name: Build MCP Input Bundle

on:
  push:
    branches: [main]
    paths:
      - mcp-local/.dockerignore
      - mcp-local/.python-version
      - mcp-local/Dockerfile.inputs
      - mcp-local/pyproject.toml
      - mcp-local/scripts/stage-build-inputs.py
      - mcp-local/uv.lock
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and scan without publishing images or promotion changes
        required: true
        type: boolean
        default: true

permissions: read-all

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/mcp-build-inputs
  PACKAGE_NAME: mcp-build-inputs
  PUBLICATION_TAG: git-${{ github.sha }}-run-${{ github.run_id }}-${{ github.run_attempt }}
  PUBLISH_IMAGES: ${{ github.ref == 'refs/heads/main' && (github.event_name != 'workflow_dispatch' || !inputs.dry_run) }}

concurrency:
  group: mcp-input-bundle-${{ github.ref }}
  cancel-in-progress: false

jobs:
  acquire-and-publish-architecture:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            arch: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up locked uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.10.2"
          enable-cache: false

      - name: Verify Python dependency lock
        shell: bash
        run: |
          set -euo pipefail
          expected_uv="$(jq -er '.generated_with.uv' mcp-local/build-inputs.lock.json)"
          actual_uv="$(uv --version | awk '{print $2}')"
          test "${actual_uv}" = "${expected_uv}"
          uv lock --directory mcp-local --check

      - name: Prepare the locked acquisition tool
        shell: bash
        run: |
          set -euo pipefail
          uv sync \
            --directory mcp-local \
            --locked \
            --only-group acquisition \
            --no-install-project

      - name: Verify existing package is private
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/verify-ghcr-package-private.sh "${PACKAGE_NAME}" --allow-missing

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      # This is the only network-capable input phase. Every byte published in
      # the artifact is checked against a dependency or build-input lock.
      - name: Acquire and verify locked inputs
        run: mcp-local/.venv/bin/python mcp-local/scripts/stage-build-inputs.py --arch ${{ matrix.arch }}

      - name: Build architecture input image locally
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: mcp-local
          file: mcp-local/Dockerfile.inputs
          target: inputs
          platforms: ${{ matrix.platform }}
          no-cache: true
          load: true
          push: false
          provenance: false
          tags: ${{ env.IMAGE }}:${{ env.PUBLICATION_TAG }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.title=Arm MCP immutable build inputs

      - name: Record local scan-candidate digest
        id: candidate
        shell: bash
        env:
          TAG: ${{ env.IMAGE }}:${{ env.PUBLICATION_TAG }}-${{ matrix.arch }}
        run: |
          set -euo pipefail
          config_digest="$(docker image inspect --format '{{.Id}}' "${TAG}")"
          if [[ ! "${config_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Local scan candidate did not return a valid config digest."
            exit 1
          fi
          echo "config-digest=${config_digest}" >> "${GITHUB_OUTPUT}"

      - name: Secure Container scan architecture input image before publication
        uses: ./.github/actions/blackduck-image-scan
        with:
          project_name: "Arm:MCP"
          project_version: "mcp-build-inputs-container-${{ matrix.arch }}-1.0"
          image_reference: ${{ env.IMAGE }}:${{ env.PUBLICATION_TAG }}-${{ matrix.arch }}
          platform: ${{ matrix.platform }}
          artifact_suffix: mcp-build-inputs-${{ matrix.arch }}
          blackducksca_url: ${{ vars.BLACKDUCKSCA_URL }}
          blackducksca_token: ${{ secrets.BLACKDUCKSCA_TOKEN }}
          github_token: ${{ github.token }}

      - name: Log in to GHCR for publication
        if: ${{ env.PUBLISH_IMAGES == 'true' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # Publish only after Black Duck succeeds.
      # This second solve reuses the first solve's BuildKit cache and uses the
      # registry exporter so BuildKit can attach provenance during publication.
      - name: Publish scanned architecture input image with provenance
        if: ${{ env.PUBLISH_IMAGES == 'true' }}
        id: publish
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: mcp-local
          file: mcp-local/Dockerfile.inputs
          target: inputs
          platforms: ${{ matrix.platform }}
          push: true
          provenance: mode=max
          tags: ${{ env.IMAGE }}:${{ env.PUBLICATION_TAG }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.title=Arm MCP immutable build inputs

      - name: Verify published image matches scanned candidate
        if: ${{ env.PUBLISH_IMAGES == 'true' }}
        shell: bash
        env:
          TAG: ${{ env.IMAGE }}:${{ env.PUBLICATION_TAG }}-${{ matrix.arch }}
          ARCH: ${{ matrix.arch }}
          EXPECTED_CONFIG_DIGEST: ${{ steps.candidate.outputs.config-digest }}
          PUBLISHED_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          set -euo pipefail
          if [[ ! "${PUBLISHED_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Published image did not return a valid sha256 digest."
            exit 1
          fi

          raw_manifest="$(docker buildx imagetools inspect "${TAG}" --raw)"
          if jq -e '.manifests | type == "array"' \
            <<<"${raw_manifest}" > /dev/null; then
            platform_digest="$(jq -er --arg arch "${ARCH}" '
              .manifests[] |
              select(.platform.os == "linux" and .platform.architecture == $arch) |
              .digest
            ' <<<"${raw_manifest}")"
            raw_manifest="$(docker buildx imagetools inspect \
              "${IMAGE}@${platform_digest}" --raw)"
          fi

          published_config_digest="$(jq -er '.config.digest' <<<"${raw_manifest}")"
          if [[ "${published_config_digest}" != "${EXPECTED_CONFIG_DIGEST}" ]]; then
            echo "::error::Published image config differs from the Black Duck scan candidate."
            exit 1
          fi

      - name: Record dry-run result
        if: ${{ env.PUBLISH_IMAGES != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "### MCP build-input dry run"
            echo ""
            echo "- Platform: \`${{ matrix.platform }}\`"
            echo "- Candidate: \`${IMAGE}:${PUBLICATION_TAG}-${{ matrix.arch }}\`"
            echo "- Black Duck Secure Container scan: completed"
            echo "- GHCR publication: skipped"
            echo "- Provenance publication: skipped"
          } >> "${GITHUB_STEP_SUMMARY}"

  publish-index:
    needs: acquire-and-publish-architecture
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name != 'workflow_dispatch' || !inputs.dry_run) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image-reference: ${{ steps.pin.outputs.image-reference }}
      amd64-reference: ${{ steps.pin.outputs.amd64-reference }}
      arm64-reference: ${{ steps.pin.outputs.arm64-reference }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Publish multi-architecture index
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "${IMAGE}:${PUBLICATION_TAG}" \
            "${IMAGE}:${PUBLICATION_TAG}-amd64" \
            "${IMAGE}:${PUBLICATION_TAG}-arm64"

      - name: Verify published package is private
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/verify-ghcr-package-private.sh "${PACKAGE_NAME}"

      - name: Record immutable input reference
        id: pin
        shell: bash
        run: |
          set -euo pipefail
          manifest="$(docker buildx imagetools inspect \
            "${IMAGE}:${PUBLICATION_TAG}" --format '{{json .Manifest}}')"
          digest="$(jq -er '.digest' <<<"${manifest}")"
          if [[ ! "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Published index did not return a valid sha256 digest."
            exit 1
          fi

          raw_manifest="$(docker buildx imagetools inspect \
            "${IMAGE}:${PUBLICATION_TAG}" --raw)"
          amd64_digest="$(jq -er '
            .manifests[] |
            select(.platform.os == "linux" and .platform.architecture == "amd64") |
            .digest
          ' <<<"${raw_manifest}")"
          arm64_digest="$(jq -er '
            .manifests[] |
            select(.platform.os == "linux" and .platform.architecture == "arm64") |
            .digest
          ' <<<"${raw_manifest}")"
          for platform_digest in "${amd64_digest}" "${arm64_digest}"; do
            if [[ ! "${platform_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::Published index contains an invalid platform digest."
              exit 1
            fi
          done

          {
            echo "image-reference=${IMAGE}@${digest}"
            echo "amd64-reference=${IMAGE}@${amd64_digest}"
            echo "arm64-reference=${IMAGE}@${arm64_digest}"
          } >> "${GITHUB_OUTPUT}"

          {
            echo "### Immutable MCP build-input artifact"
            echo ""
            echo "- Tag: \`${IMAGE}:${PUBLICATION_TAG}\`"
            echo "- Digest: \`${digest}\`"
            echo "- MCP build input: \`${IMAGE}@${digest}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

  propose-input-pin:
    needs: publish-index
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: write
      contents: write
      pull-requests: write
    env:
      PROMOTION_BRANCH: automation/pin-mcp-build-inputs
      INPUT_REFERENCE: ${{ needs.publish-index.outputs.image-reference }}
      AMD64_REFERENCE: ${{ needs.publish-index.outputs.amd64-reference }}
      ARM64_REFERENCE: ${{ needs.publish-index.outputs.arm64-reference }}
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0

      - name: Verify main has not advanced
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Update checked-in MCP input pin
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/update-mcp-input-pin.py \
            --reference "${INPUT_REFERENCE}" \
            --amd64-reference "${AMD64_REFERENCE}" \
            --arm64-reference "${ARM64_REFERENCE}" \
            --source-revision "${GITHUB_SHA}" \
            --workflow-run "${GITHUB_RUN_ID}"

      - name: Propose MCP input pin for review
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_MESSAGE: "chore: update MCP build-input bundle"
          PR_TITLE: "chore: update MCP build-input bundle"
          PR_BODY: |
            Updates the immutable MCP build-input bundle after its source inputs changed.

            - Source revision: `${{ github.sha }}`
            - Workflow run: [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            - Candidate: `${{ env.INPUT_REFERENCE }}`
            - AMD64 manifest: `${{ env.AMD64_REFERENCE }}`
            - Arm64 manifest: `${{ env.ARM64_REFERENCE }}`

            This PR keeps the build-input manifest and Dockerfile default synchronized.
          SUMMARY_TITLE: MCP build-input promotion
          CANDIDATE: ${{ env.INPUT_REFERENCE }}
        run: >-
          bash .github/scripts/propose-pin-pr.sh
          mcp-local/Dockerfile
          mcp-local/build-inputs.lock.json
