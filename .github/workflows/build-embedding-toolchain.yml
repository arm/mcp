name: Build Embedding Toolchain Image

on:
  push:
    branches: [main]
    paths:
      - embedding-generation/.dockerignore
      - embedding-generation/.python-version
      - embedding-generation/Dockerfile.toolchain
      - embedding-generation/acquire-model.py
      - embedding-generation/document_chunking.py
      - embedding-generation/embedding-model.lock.json
      - embedding-generation/generate-chunks.py
      - embedding-generation/local_vectorstore_creation.py
      - embedding-generation/pyproject.toml
      - embedding-generation/uv.lock
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and scan without publishing the image or proposing a pin update
        required: true
        type: boolean
        default: true

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/mcp-embedding-generator
  PACKAGE_NAME: mcp-embedding-generator
  PUBLISH_IMAGE: ${{ github.ref == 'refs/heads/main' && (github.event_name != 'workflow_dispatch' || !inputs.dry_run) }}

concurrency:
  group: embedding-toolchain-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-toolchain:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      packages: write
      security-events: write
      id-token: write
      attestations: write
      artifact-metadata: write
    outputs:
      image-digest: ${{ steps.publish.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Verify existing GHCR package is private
        if: ${{ env.PUBLISH_IMAGE == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/verify-ghcr-package-private.sh "${PACKAGE_NAME}" --allow-missing

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Build toolchain image locally
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: embedding-generation
          file: embedding-generation/Dockerfile.toolchain
          platforms: linux/arm64
          load: true
          push: false
          provenance: false
          tags: ${{ env.IMAGE }}:git-${{ github.sha }}-run-${{ github.run_id }}-${{ github.run_attempt }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.title=Arm MCP embedding toolchain

      - name: Secure Container scan toolchain image before publication
        uses: ./.github/actions/blackduck-image-scan
        with:
          project_name: "Arm:MCP"
          project_version: "mcp-embedding-generator-container-1.0"
          image_reference: ${{ env.IMAGE }}:git-${{ github.sha }}-run-${{ github.run_id }}-${{ github.run_attempt }}
          platform: linux/arm64
          artifact_suffix: mcp-embedding-generator-arm64
          blackducksca_url: ${{ vars.BLACKDUCKSCA_URL }}
          blackducksca_token: ${{ secrets.BLACKDUCKSCA_TOKEN }}
          distribution: "INTERNAL"

      - name: Log in to GHCR for publication
        if: ${{ env.PUBLISH_IMAGE == 'true' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # Publish only the local image that passed the Black Duck gate.
      - name: Publish scanned toolchain image
        if: ${{ env.PUBLISH_IMAGE == 'true' }}
        id: publish
        shell: bash
        env:
          TAG: ${{ env.IMAGE }}:git-${{ github.sha }}-run-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          docker push "${TAG}"
          manifest="$(docker buildx imagetools inspect \
            "${TAG}" --format '{{json .Manifest}}')"
          digest="$(jq -er '.digest' <<<"${manifest}")"
          if [[ ! "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Published image did not return a valid sha256 digest."
            exit 1
          fi
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"

      - name: Generate toolchain provenance attestation
        if: ${{ env.PUBLISH_IMAGE == 'true' }}
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true

      - name: Verify published GHCR package is private
        if: ${{ env.PUBLISH_IMAGE == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/verify-ghcr-package-private.sh "${PACKAGE_NAME}"

      - name: Record published digest
        if: ${{ env.PUBLISH_IMAGE == 'true' }}
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
          TAG: ${{ env.IMAGE }}:git-${{ github.sha }}-run-${{ github.run_id }}-${{ github.run_attempt }}
          ATTESTATION_URL: ${{ steps.attest.outputs.attestation-url }}
        run: |
          set -euo pipefail
          if [[ -z "${ATTESTATION_URL}" ]]; then
            echo "::error::Attestation action did not return an attestation URL."
            exit 1
          fi

          {
            echo "### Embedding toolchain image"
            echo ""
            echo "- Tag: \`${TAG}\`"
            echo "- Immutable reference: \`${IMAGE}@${DIGEST}\`"
            echo "- Attestation: [view provenance](${ATTESTATION_URL})"
          } >> "${GITHUB_STEP_SUMMARY}"

  propose-toolchain-pin:
    needs: build-toolchain
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name != 'workflow_dispatch' || !inputs.dry_run) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: write
      contents: write
      pull-requests: write
    env:
      PROMOTION_BRANCH: automation/pin-embedding-generator
      TOOLCHAIN_REFERENCE: ghcr.io/${{ github.repository_owner }}/mcp-embedding-generator@${{ needs.build-toolchain.outputs.image-digest }}
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0

      - name: Verify main has not advanced
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Update checked-in toolchain pin
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/update-embedding-toolchain-pin.py \
            --reference "${TOOLCHAIN_REFERENCE}"

      - name: Propose toolchain pin for review
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_MESSAGE: "chore: update embedding toolchain input"
          PR_TITLE: "chore: update embedding toolchain input"
          PR_BODY: |
            Updates the immutable embedding toolchain input after its source inputs changed.

            - Source revision: `${{ github.sha }}`
            - Workflow run: [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            - Candidate: `${{ env.TOOLCHAIN_REFERENCE }}`

            Merging this PR makes subsequent embedding-generation runs use the rebuilt toolchain.
          SUMMARY_TITLE: Embedding toolchain promotion
          CANDIDATE: ${{ env.TOOLCHAIN_REFERENCE }}
        run: >-
          bash .github/scripts/propose-pin-pr.sh
          embedding-generation/pipeline-inputs.lock.json
