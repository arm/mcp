name: Publish MCP Registry

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      source_sha:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Existing approved release to publish or retry (X.Y.Z, without v)
        required: true
        type: string

permissions:
  contents: read

# Manual catch-up/retries serialize with releases and withdrawals. Automatic
# calls already hold that lock in Build MCP Image; do not acquire it twice.
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && 'build-mcp-image-publish' || format('mcp-registry-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      ${{
        github.repository == 'arm/mcp'
        && github.ref == 'refs/heads/main'
        && github.ref_protected == true
        && (
          (github.event_name == 'push'
            && github.workflow_ref == 'arm/mcp/.github/workflows/build-mcp-image.yml@refs/heads/main'
            && inputs.source_sha == github.sha)
          || (github.event_name == 'workflow_dispatch'
            && github.workflow_ref == 'arm/mcp/.github/workflows/publish-mcp-registry.yml@refs/heads/main')
        )
      }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - uses: ./.github/actions/setup-mcp-publisher
      - name: Verify released source, image and provenance
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          EXPECTED_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          python3 .github/scripts/mcp_registry.py prepare \
            --version "${VERSION}" --expected-source-sha "${EXPECTED_SOURCE_SHA}" \
            --manifest "${RUNNER_TEMP}/registry/server.json"
          mcp-publisher validate "${RUNNER_TEMP}/registry/server.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mcp-registry-manifest
          path: ${{ runner.temp }}/registry/server.json
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: prepare
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mcp-registry-manifest
          path: ${{ runner.temp }}/registry
      - uses: ./.github/actions/setup-mcp-publisher
      - name: Authenticate with GitHub OIDC
        run: mcp-publisher login github-oidc
      - name: Publish and verify metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .github/scripts/mcp_registry.py publish \
            --manifest "${RUNNER_TEMP}/registry/server.json"
