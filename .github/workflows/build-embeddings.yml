name: Build Offline Embedding Pipeline

on:
  schedule:
    - cron: "0 9 * * 0"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and scan without publishing images or promotion changes
        required: true
        type: boolean
        default: true

permissions: read-all

env:
  CHUNK_IMAGE: ghcr.io/${{ github.repository_owner }}/mcp-embedding-chunks
  CHUNK_PACKAGE_NAME: mcp-embedding-chunks
  VECTORSTORE_IMAGE: ghcr.io/${{ github.repository_owner }}/mcp-embedding-vectorstore
  VECTORSTORE_PACKAGE_NAME: mcp-embedding-vectorstore
  PUBLISH_IMAGES: ${{ github.ref == 'refs/heads/main' && (github.event_name != 'workflow_dispatch' || !inputs.dry_run) }}

concurrency:
  group: embedding-pipeline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  acquire-and-publish-chunks:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    outputs:
      chunk-artifact-digest: ${{ steps.publish.outputs.digest }}
      generator-image: ${{ steps.inputs.outputs.generator_image }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Load immutable pipeline inputs
        id: inputs
        shell: bash
        run: |
          set -euo pipefail
          inputs_file="embedding-generation/pipeline-inputs.lock.json"

          if ! jq -e '
            type == "object" and
            (keys | sort) == ["generator_image", "intrinsic_chunks_image"]
          ' "${inputs_file}" > /dev/null; then
            echo "::error::${inputs_file} must contain only the two expected image inputs."
            exit 1
          fi

          generator_image="$(jq -er '.generator_image | select(type == "string")' "${inputs_file}")"
          intrinsic_chunks_image="$(jq -er '.intrinsic_chunks_image | select(type == "string")' "${inputs_file}")"
          digest_pattern='^[A-Za-z0-9./:_-]+@sha256:[0-9a-f]{64}$'

          if [[ ! "${generator_image}" =~ ${digest_pattern} ]]; then
            echo "::error::generator_image is not an immutable sha256 reference."
            exit 1
          fi
          if [[ ! "${intrinsic_chunks_image}" =~ ${digest_pattern} ]]; then
            echo "::error::intrinsic_chunks_image is not an immutable sha256 reference."
            exit 1
          fi

          {
            printf 'generator_image=%s\n' "${generator_image}"
            printf 'intrinsic_chunks_image=%s\n' "${intrinsic_chunks_image}"
          } >> "${GITHUB_OUTPUT}"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Verify existing chunk package is private
        if: ${{ env.PUBLISH_IMAGES == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/verify-ghcr-package-private.sh "${CHUNK_PACKAGE_NAME}" --allow-missing

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Acquire and publish chunk artifact
        if: ${{ env.PUBLISH_IMAGES == 'true' }}
        id: publish
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: embedding-generation
          file: embedding-generation/Dockerfile.acquire
          target: chunks
          platforms: linux/arm64
          pull: true
          no-cache: true
          push: true
          build-contexts: |
            toolchain=docker-image://${{ steps.inputs.outputs.generator_image }}
            intrinsic-chunks=docker-image://${{ steps.inputs.outputs.intrinsic_chunks_image }}
          tags: ${{ env.CHUNK_IMAGE }}:git-${{ github.sha }}-run-${{ github.run_id }}-${{ github.run_attempt }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.title=Arm MCP immutable embedding chunks

      - name: Acquire chunk artifact for dry run
        if: ${{ env.PUBLISH_IMAGES != 'true' }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: embedding-generation
          file: embedding-generation/Dockerfile.acquire
          target: chunks
          platforms: linux/arm64
          pull: true
          no-cache: true
          push: false
          provenance: false
          outputs: type=local,dest=${{ runner.temp }}/embedding-chunks
          build-contexts: |
            toolchain=docker-image://${{ steps.inputs.outputs.generator_image }}
            intrinsic-chunks=docker-image://${{ steps.inputs.outputs.intrinsic_chunks_image }}

      - name: Pass dry-run chunks to vectorstore build
        if: ${{ env.PUBLISH_IMAGES != 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: embedding-chunks-dry-run
          path: ${{ runner.temp }}/embedding-chunks
          if-no-files-found: error
          retention-days: 1

      - name: Verify published chunk package is private
        if: ${{ env.PUBLISH_IMAGES == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/verify-ghcr-package-private.sh "${CHUNK_PACKAGE_NAME}"

      - name: Record published chunk digest
        if: ${{ env.PUBLISH_IMAGES == 'true' }}
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
          TAG: ${{ env.CHUNK_IMAGE }}:git-${{ github.sha }}-run-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          if [[ ! "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Build did not return a valid chunk artifact digest."
            exit 1
          fi

          {
            echo "### Immutable embedding chunk artifact"
            echo ""
            echo "- Tag: \`${TAG}\`"
            echo "- Digest: \`${DIGEST}\`"
            echo "- Pipeline input: \`${CHUNK_IMAGE}@${DIGEST}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

  generate-and-publish-vectorstore:
    needs: acquire-and-publish-chunks
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    permissions:
      actions: read
      contents: read
      packages: write
      security-events: write
      id-token: write
      attestations: write
      artifact-metadata: write
    outputs:
      embeddings-image-digest: ${{ steps.publish.outputs.digest }}
      attestation-url: ${{ steps.attest.outputs.attestation-url }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download dry-run chunk artifact
        if: ${{ env.PUBLISH_IMAGES != 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: embedding-chunks-dry-run
          path: ${{ runner.temp }}/embedding-chunks

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Verify existing vectorstore package is private
        if: ${{ env.PUBLISH_IMAGES == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/verify-ghcr-package-private.sh "${VECTORSTORE_PACKAGE_NAME}" --allow-missing

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Resolve chunk build context
        id: chunk-context
        shell: bash
        env:
          PUBLISHED_CHUNK_DIGEST: ${{ needs.acquire-and-publish-chunks.outputs.chunk-artifact-digest }}
        run: |
          set -euo pipefail
          if [[ "${PUBLISH_IMAGES}" == "true" ]]; then
            if [[ ! "${PUBLISHED_CHUNK_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::Chunk publication did not return a valid sha256 digest."
              exit 1
            fi
            printf 'context=docker-image://%s@%s\n' \
              "${CHUNK_IMAGE}" "${PUBLISHED_CHUNK_DIGEST}" >> "${GITHUB_OUTPUT}"
          else
            dry_run_context="${RUNNER_TEMP}/embedding-chunks"
            if [[ ! -d "${dry_run_context}/embedding-data" ]]; then
              dry_run_context="${dry_run_context}/linux_arm64"
            fi
            if [[ ! -d "${dry_run_context}/embedding-data" ]]; then
              echo "::error::Downloaded chunk artifact does not contain embedding-data."
              exit 1
            fi
            printf 'context=%s\n' "${dry_run_context}" >> "${GITHUB_OUTPUT}"
          fi

      - name: Generate vectorstore image locally
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: embedding-generation
          file: embedding-generation/Dockerfile.vectorstore
          target: vectorstore
          platforms: linux/arm64
          pull: true
          network: none
          load: true
          push: false
          # The scanned local image is explicitly attested after publication.
          provenance: false
          build-contexts: |
            toolchain=docker-image://${{ needs.acquire-and-publish-chunks.outputs.generator-image }}
            chunks=${{ steps.chunk-context.outputs.context }}
          tags: ${{ env.VECTORSTORE_IMAGE }}:git-${{ github.sha }}-run-${{ github.run_id }}-${{ github.run_attempt }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.title=Arm MCP embeddings

      - name: Remove GHCR credentials before scanning
        run: docker logout ghcr.io

      - name: Scan vectorstore image before publication
        uses: ./.github/actions/blackduck-image-scan
        with:
          project_name: "Arm:MCP"
          project_version: "mcp-embedding-vectorstore-1.0"
          image_reference: ${{ env.VECTORSTORE_IMAGE }}:git-${{ github.sha }}-run-${{ github.run_id }}-${{ github.run_attempt }}
          platform: linux/arm64
          artifact_suffix: mcp-embedding-vectorstore-arm64
          blackducksca_url: ${{ vars.BLACKDUCKSCA_URL }}
          blackducksca_token: ${{ secrets.BLACKDUCKSCA_TOKEN }}
          github_token: ${{ github.token }}

      - name: Log in to GHCR for publication
        if: ${{ env.PUBLISH_IMAGES == 'true' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # Publish only the local image that passed the Black Duck gate.
      - name: Publish scanned vectorstore image
        if: ${{ env.PUBLISH_IMAGES == 'true' }}
        id: publish
        shell: bash
        env:
          TAG: ${{ env.VECTORSTORE_IMAGE }}:git-${{ github.sha }}-run-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          docker push "${TAG}"
          manifest="$(docker buildx imagetools inspect \
            "${TAG}" --format '{{json .Manifest}}')"
          digest="$(jq -er '.digest' <<<"${manifest}")"
          if [[ ! "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Published image did not return a valid sha256 digest."
            exit 1
          fi
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"

      - name: Verify published vectorstore package is private
        if: ${{ env.PUBLISH_IMAGES == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/verify-ghcr-package-private.sh "${VECTORSTORE_PACKAGE_NAME}"

      - name: Validate published embeddings digest
        if: ${{ env.PUBLISH_IMAGES == 'true' }}
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          set -euo pipefail
          if [[ ! "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Build did not return a valid embeddings image digest."
            exit 1
          fi

      - name: Generate embeddings provenance attestation
        if: ${{ env.PUBLISH_IMAGES == 'true' }}
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.VECTORSTORE_IMAGE }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true

      - name: Record published embeddings digest
        if: ${{ env.PUBLISH_IMAGES == 'true' }}
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
          TAG: ${{ env.VECTORSTORE_IMAGE }}:git-${{ github.sha }}-run-${{ github.run_id }}-${{ github.run_attempt }}
          SOURCE_COMMIT: ${{ github.sha }}
          ATTESTATION_URL: ${{ steps.attest.outputs.attestation-url }}
        run: |
          set -euo pipefail
          if [[ -z "${ATTESTATION_URL}" ]]; then
            echo "::error::Attestation action did not return an attestation URL."
            exit 1
          fi

          {
            echo "### Attested embeddings image"
            echo ""
            echo "- Image: \`${VECTORSTORE_IMAGE}@${DIGEST}\`"
            echo "- Tag: \`${TAG}\`"
            echo "- Source commit: [\`${SOURCE_COMMIT}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${SOURCE_COMMIT})"
            echo "- Attestation: [view provenance](${ATTESTATION_URL})"
          } >> "${GITHUB_STEP_SUMMARY}"

  propose-mcp-embedding-pin:
    needs:
      - generate-and-publish-vectorstore
      - verify-vectorstore-provenance
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name != 'workflow_dispatch' || !inputs.dry_run) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: write
      # Required only for pushing the reviewed promotion branch. GitHub token
      # permissions cannot be narrowed to an individual step.
      contents: write
      pull-requests: write
    env:
      PROMOTION_BRANCH: automation/pin-embedding-vectorstore
      EMBEDDINGS_REFERENCE: ghcr.io/${{ github.repository_owner }}/mcp-embedding-vectorstore@${{ needs.generate-and-publish-vectorstore.outputs.embeddings-image-digest }}
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0

      - name: Verify main has not advanced
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Update checked-in embedding pin and release version
        id: update
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/update-mcp-embedding-pin.py \
            --reference "${EMBEDDINGS_REFERENCE}" \
            --source-revision "${GITHUB_SHA}" \
            --workflow-run "${GITHUB_RUN_ID}"

          release_version="$(jq -er '.version' mcp-local/server.json)"
          echo "release_version=${release_version}" >> "${GITHUB_OUTPUT}"

      - name: Propose embedding pin for review
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_MESSAGE: "chore: promote embeddings for ${{ steps.update.outputs.release_version }}"
          PR_TITLE: "chore: promote embeddings for ${{ steps.update.outputs.release_version }}"
          PR_BODY: |
            Promotes the immutable embedding vector store produced by:

            - Source revision: `${{ github.sha }}`
            - Workflow run: [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            - Candidate: `${{ env.EMBEDDINGS_REFERENCE }}`
            - Proposed MCP version: `${{ steps.update.outputs.release_version }}`

            This PR updates the checked-in build-input manifest, Dockerfile default, and MCP release version. Merging the reviewed PR releases an MCP image using this exact digest.
          SUMMARY_TITLE: MCP embedding promotion
          CANDIDATE: ${{ env.EMBEDDINGS_REFERENCE }}
          SUMMARY_DETAILS: |
            - Proposed MCP version: `${{ steps.update.outputs.release_version }}`
        run: >-
          bash .github/scripts/propose-pin-pr.sh
          mcp-local/Dockerfile
          mcp-local/build-inputs.lock.json
          mcp-local/server.json

  verify-vectorstore-provenance:
    needs: generate-and-publish-vectorstore
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name != 'workflow_dispatch' || !inputs.dry_run) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
      attestations: read
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Verify provenance through GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ needs.generate-and-publish-vectorstore.outputs.embeddings-image-digest }}
        run: |
          set -euo pipefail
          gh attestation verify \
            "oci://${VECTORSTORE_IMAGE}@${DIGEST}" \
            --repo "${GITHUB_REPOSITORY}" \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/build-embeddings.yml" \
            --source-ref "${GITHUB_REF}" \
            --source-digest "${GITHUB_SHA}"

      - name: Verify registry-attached provenance
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ needs.generate-and-publish-vectorstore.outputs.embeddings-image-digest }}
        run: |
          set -euo pipefail
          gh attestation verify \
            "oci://${VECTORSTORE_IMAGE}@${DIGEST}" \
            --repo "${GITHUB_REPOSITORY}" \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/build-embeddings.yml" \
            --source-ref "${GITHUB_REF}" \
            --source-digest "${GITHUB_SHA}" \
            --bundle-from-oci
