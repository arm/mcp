name: Build MCP Image

on:
  pull_request:
    branches: [main]
    paths:
      - mcp-local/server.json
  push:
    branches: [main]
    paths:
      - mcp-local/server.json
  workflow_dispatch:
    inputs:
      release_action:
        description: Build without publishing, or propose a reviewed release PR
        type: choice
        options:
          - dry-run
          - hotfix
          - minor
          - major
        default: dry-run

permissions:
  contents: read

env:
  IMAGE_FQDN: docker.io/armlimited/arm-mcp

# Version PRs serialize naturally at merge time. The production reusable call
# remains serialized so closely spaced releases cannot race when updating latest.
concurrency:
  group: ${{ github.event_name == 'push' && 'build-mcp-image-publish' || format('build-mcp-image-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  propose-version:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_action != 'dry-run' }}
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0

      - name: Open or update reviewed version PR
        shell: bash
        env:
          BUMP_TYPE: ${{ inputs.release_action }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch="automation/release-${BUMP_TYPE}"
          git checkout -B "${branch}"
          version="$(python3 .github/scripts/bump_mcp_version.py --bump-type "${BUMP_TYPE}")"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add mcp-local/server.json
          git commit -m "chore: propose ${BUMP_TYPE} release ${version}"

          git fetch origin "${branch}:refs/remotes/origin/${branch}" || true
          git push --force-with-lease origin "HEAD:refs/heads/${branch}"

          body="Proposes reviewed ${BUMP_TYPE} release \`${version}\`. Merging this PR triggers the release workflow."
          pr_url="$(gh pr list \
            --base main \
            --head "${branch}" \
            --state open \
            --json url \
            --jq '.[0].url // empty')"
          if [ -z "${pr_url}" ]; then
            pr_url="$(gh pr create \
              --base main \
              --head "${branch}" \
              --title "chore: propose ${BUMP_TYPE} release ${version}" \
              --body "${body}")"
          else
            gh pr edit "${pr_url}" \
              --title "chore: propose ${BUMP_TYPE} release ${version}" \
              --body "${body}"
          fi

          .github/scripts/dispatch-required-pr-checks.sh "${branch}"

          {
            echo "### Reviewed release proposal"
            echo ""
            echo "- Type: ${BUMP_TYPE}"
            echo "- Version: \`${version}\`"
            echo "- Pull request: ${pr_url}"
          } >> "${GITHUB_STEP_SUMMARY}"

  detect-version-change:
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.version.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - id: version
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          changed=true
          server_file=mcp-local/server.json
          if git cat-file -e "${BASE_SHA}:${server_file}" 2>/dev/null \
            && [ "$(jq -r '.version' "${server_file}")" = "$(git show "${BASE_SHA}:${server_file}" | jq -r '.version')" ]; then
            changed=false
          fi
          echo "changed=${changed}" >> "${GITHUB_OUTPUT}"

  validate-version-pr:
    needs: detect-version-change
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout proposed release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Validate proposed release version
        shell: bash
        env:
          VERSION_CHANGED: ${{ needs.detect-version-change.outputs.changed }}
        run: |
          set -euo pipefail
          server_file="mcp-local/server.json"
          version="$(jq -er '.version | select(type == "string")' "${server_file}")"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::server.json version must use X.Y.Z semantic versioning: ${version}"
            exit 1
          fi

          expected_image="${IMAGE_FQDN}:${version}"
          if ! jq -e --arg image "${expected_image}" '
            [.packages[]? | select(.registryType == "oci") | .identifier] | index($image) != null
          ' "${server_file}" > /dev/null; then
            echo "::error::server.json must identify the release image as ${expected_image}."
            exit 1
          fi

          if [ "${VERSION_CHANGED}" = "true" ] \
            && git rev-parse -q --verify "refs/tags/v${version}" > /dev/null; then
            echo "::error::Release tag v${version} already exists. Submit a new reviewed version PR."
            exit 1
          fi

  dry-run:
    if: >-
      ${{
        github.repository == 'arm/mcp'
        && github.event_name == 'workflow_dispatch'
        && inputs.release_action == 'dry-run'
      }}
    permissions:
      # GitHub validates every nested job's maximum permissions before it
      # evaluates mode-specific conditions. Jobs that execute in dry-run mode
      # explicitly downgrade these permissions, and this call receives no
      # registry publication secrets.
      actions: read
      contents: write
      packages: read
      security-events: write
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: ./.github/workflows/trusted-mcp-release.yml
    with:
      release_mode: dry-run
    secrets:
      BLACKDUCKSCA_TOKEN: ${{ secrets.BLACKDUCKSCA_TOKEN }}

  production:
    needs: detect-version-change
    if: >-
      ${{
        github.repository == 'arm/mcp'
        && github.event_name == 'push'
        && needs.detect-version-change.outputs.changed == 'true'
        && github.ref == 'refs/heads/main'
        && github.ref_type == 'branch'
        && github.ref_protected == true
        && github.sha == github.event.after
      }}
    permissions:
      actions: read
      contents: write
      packages: read
      security-events: write
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: ./.github/workflows/trusted-mcp-release.yml
    with:
      release_mode: production
    secrets:
      BLACKDUCKSCA_TOKEN: ${{ secrets.BLACKDUCKSCA_TOKEN }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
