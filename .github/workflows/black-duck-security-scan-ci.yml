# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# Black Duck Security Action allows you to integrate Static Analysis Security Testing (SAST) and Software Composition Analysis (SCA) into your CI/CD pipelines.
# For more information about configuring your workflow,
# read our documentation at https://github.com/blackduck-inc/black-duck-security-scan

name: CI Black Duck security scan

on:
  push:
    branches: [ "main" ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ "main" ]
  schedule:
    - cron: '34 5 * * 6'

# Declare default permissions as read only.
permissions: read-all

concurrency:
  group: blackduck-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source_scan:
    name: Main Push and Scheduled full source scan
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      security-events: write
      actions: read
    env:
      # Set in Arm BlackDuck UI
      DETECT_PROJECT_NAME: "Arm:MCP"
      DETECT_PROJECT_VERSION_NAME: "mcp-source-1.0"

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name: Show Black Duck target
        run: |
          # notice - highlighted in the gh actions UI
          echo "::notice title=Black Duck target::${{ env.DETECT_PROJECT_NAME }} / ${{ env.DETECT_PROJECT_VERSION_NAME }}"
      
      - name: Black Duck SCA scan
        id: black-duck-full-scan
        if: ${{ github.event_name != 'pull_request' }}
        continue-on-error: true
        uses: blackduck-inc/black-duck-security-scan@152247222aa9cd38124acd5c0cf60f4db71adc3f # v2.11.0
        with:
          ### ---------- BLACKDUCK SCA SCANNING: REQUIRED FIELDS ----------
          blackducksca_url: ${{ vars.BLACKDUCKSCA_URL }}
          blackducksca_token: ${{ secrets.BLACKDUCKSCA_TOKEN }}
          blackducksca_scan_full: true
          bridgecli_download_version: "4.5.0"

          ### SCANNING: Optional fields
          blackducksca_scan_failure_severities: 'BLOCKER,CRITICAL'
          detect_args: "--detect.accuracy.required=NONE"

          ### FIX PULL REQUEST CREATION
          blackducksca_fixpr_enabled: true
          # Dedicated token with Contents and Pull requests read/write access.
          github_token: ${{ secrets.BLACKDUCK_GITHUB_TOKEN }}

          ### SARIF report generation for upload to GitHub Advanced Security
          blackducksca_reports_sarif_create: true
          blackducksca_reports_sarif_file_path: blackduck-results.sarif
          blackducksca_reports_sarif_severities: 'Critical,High,Medium,Low'
          blackducksca_reports_sarif_groupSCAIssues: false
          ### Set upload to false & then later upload via github/codeql-action/upload-sarif@v4.37.4 to avoid token-permissions issue flagged by scorecard
          blackducksca_upload_sarif_report: false

          ### Mark build status as failure if policy violating issues are found
          mark_build_status: 'failure'

          ### To enable Black Duck SCA policy badges
          #blackducksca_policy_badges_create: false
          #blackducksca_policy_badges_maxCount: 5

          ### To upload Bridge diagnostic files
          include_diagnostics: true

      - name: Upload Black Duck SARIF
        if: ${{ !cancelled() && github.event_name != 'pull_request' && hashFiles('blackduck-results.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: blackduck-results.sarif

      - name: Retain Black Duck source SARIF
        if: ${{ always() && github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: blackduck-source-sarif-${{ github.run_id }}
          path: blackduck-results.sarif
          if-no-files-found: warn
          retention-days: 10

      - name: Export Black Duck CycloneDX SBOM
        id: source-sbom-export
        if: >-
          ${{
            !cancelled()
            && github.event_name != 'pull_request'
            && steps.black-duck-full-scan.outcome == 'success'
          }}
        env:
          BLACKDUCK_TOKEN: ${{ secrets.BLACKDUCKSCA_TOKEN }}
          BLACKDUCK_URL: ${{ vars.BLACKDUCKSCA_URL }}
        run: |
          set -euo pipefail
          python3 .github/scripts/export-blackduck-cyclonedx.py \
            --blackduck-url "${BLACKDUCK_URL}" \
            --project "${DETECT_PROJECT_NAME}" \
            --version "${DETECT_PROJECT_VERSION_NAME}" \
            --timeout 14400 \
            --output "${RUNNER_TEMP}/blackduck-source-sbom-${GITHUB_SHA}.cdx.json"

      - name: Retain Black Duck source CycloneDX SBOM
        if: >-
          ${{
            !cancelled()
            && github.event_name != 'pull_request'
            && steps.black-duck-full-scan.outcome == 'success'
            && steps.source-sbom-export.outcome == 'success'
          }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: blackduck-source-sbom-${{ github.run_id }}
          path: ${{ runner.temp }}/blackduck-source-sbom-${{ github.sha }}.cdx.json
          if-no-files-found: error
          retention-days: 10

      - name: Write Black Duck source scan summary
        if: ${{ always() && github.event_name != 'pull_request' }}
        env:
          SCAN_OUTCOME: ${{ steps.black-duck-full-scan.outcome }}
          SCAN_STATUS: ${{ steps.black-duck-full-scan.outputs.status }}
          SBOM_OUTCOME: ${{ steps.source-sbom-export.outcome }}
        run: |
          set -euo pipefail
          if [[ "${SCAN_OUTCOME}" == "success" ]]; then
            scan_result="passed"
          elif [[ "${SCAN_STATUS}" == "8" ]]; then
            scan_result="policy violation"
          else
            scan_result="source scan error"
          fi
          {
            echo "### Black Duck source scan"
            echo ""
            printf -- '- Project: `%s`\n' "${DETECT_PROJECT_NAME}"
            printf -- '- Version: `%s`\n' "${DETECT_PROJECT_VERSION_NAME}"
            echo '- Policy gate: `BLOCKER,CRITICAL`'
            printf -- '- Scan outcome: `%s`\n' "${SCAN_OUTCOME}"
            printf -- '- Bridge exit status: `%s`\n' "${SCAN_STATUS:-unavailable}"
            printf -- '- Result classification: `%s`\n' "${scan_result}"
            printf -- '- CycloneDX SBOM export: `%s`\n' "${SBOM_OUTCOME:-not-run}"
            echo '- SARIF retention: workflow artifact for 10 days'
            echo '- Bridge diagnostics: retained by the Black Duck action'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Report Black Duck source policy violation
        if: ${{ always() && github.event_name != 'pull_request' && steps.black-duck-full-scan.outcome != 'success' && steps.black-duck-full-scan.outputs.status == '8' }}
        run: |
          echo "::error title=Black Duck policy violation::The source scan completed, but a BLOCKER/CRITICAL policy violation failed the CI gate (Bridge exit code 8)."
          exit 1

      - name: Report Black Duck source scan failure
        if: ${{ always() && github.event_name != 'pull_request' && steps.black-duck-full-scan.outcome != 'success' && steps.black-duck-full-scan.outputs.status != '8' }}
        env:
          SCAN_OUTCOME: ${{ steps.black-duck-full-scan.outcome }}
          SCAN_STATUS: ${{ steps.black-duck-full-scan.outputs.status }}
        run: |
          echo "::error title=Black Duck source scan failure::The scan or its integration failed (outcome=${SCAN_OUTCOME}, Bridge exit code=${SCAN_STATUS:-unavailable}). Review the retained diagnostics for the underlying error."
          exit 1

  pull_request_scan:
    name: Black Duck security scan
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360 #setting it to maximum allowed time for a job to run, since the build and blackduck scan can take a long time
    permissions:
      contents: read
    env:
      DETECT_PROJECT_NAME: "Arm:MCP"
      DETECT_PROJECT_VERSION_NAME: "mcp-source-1.0"
      HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
    steps:
      - name: Enforce the Black Duck pull request policy
        run: |
          set -euo pipefail
          if [[ "${HEAD_REPOSITORY}" != "${GITHUB_REPOSITORY}" ]]; then
            message="Fork pull requests cannot run credentialed Black Duck checks. "
            message+="Use the Promote reviewed fork pull request workflow, then "
            message+="review and merge the internal pull request it creates. "
            message+="Do not merge this source pull request."
            echo "::error title=Merge the promoted internal pull request::${message}"
            exit 1
          fi

      - name: Verify promoted branch remains pinned to its reviewed commit
        if: >-
          ${{
            startsWith(
              github.event.pull_request.head.ref,
              'external-contributions/'
            )
            || startsWith(
              github.event.pull_request.head.ref,
              'trusted-fork-'
            )
          }}
        env:
          ACTUAL_SHA: ${{ github.event.pull_request.head.sha }}
          PROMOTED_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          expected_sha="${PROMOTED_REF##*-}"
          if [[ ! "${expected_sha}" =~ ^[0-9a-fA-F]{40}$ \
            && ! "${expected_sha}" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "::error title=Invalid promoted branch::The branch name does not end with a full reviewed commit SHA."
            exit 1
          fi
          if [[ "${ACTUAL_SHA,,}" != "${expected_sha,,}" ]]; then
            echo "::error title=Promoted branch moved::Expected ${expected_sha}, found ${ACTUAL_SHA}. Do not update or merge this promoted branch."
            exit 1
          fi

      - name: Checkout the reviewed pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Materialize inert source directory without executing repository code
        env:
          REVIEWED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${REVIEWED_SHA}"
          python3 -I - <<'PY'
          import os
          import re
          import shutil
          import subprocess
          from pathlib import Path, PurePosixPath

          reviewed_sha = os.environ["REVIEWED_SHA"]
          if not re.fullmatch(r"[0-9a-fA-F]{40}|[0-9a-fA-F]{64}", reviewed_sha):
              raise SystemExit("REVIEWED_SHA is not a full commit object ID")

          listing = subprocess.run(
              ["git", "ls-tree", "-rz", "--full-tree", reviewed_sha],
              check=True,
              stdout=subprocess.PIPE,
          ).stdout
          records = [record for record in listing.split(b"\0") if record]
          source_directory = Path(os.environ["RUNNER_TEMP"]) / "blackduck-pr-source"
          source_directory.mkdir(mode=0o700)
          blob_count = 0

          for record in records:
              try:
                  metadata, raw_path = record.split(b"\t", 1)
                  mode, object_type, object_id = metadata.decode("ascii").split()
                  path = raw_path.decode("utf-8")
              except (UnicodeDecodeError, ValueError) as error:
                  raise SystemExit(
                      "Reviewed tree contains an unsupported entry"
                  ) from error

              # Recursive ls-tree output can also contain submodule commits;
              # every file and symlink stored as a Git blob is materialized here.
              if object_type != "blob":
                  continue
              if mode not in {"100644", "100755", "120000"}:
                  raise SystemExit(f"Unsupported Git blob mode {mode} for {path!r}")
              if not re.fullmatch(r"[0-9a-fA-F]{40}|[0-9a-fA-F]{64}", object_id):
                  raise SystemExit(f"Invalid Git blob object ID for {path!r}")

              parsed_path = PurePosixPath(path)
              if (
                  not path
                  or parsed_path.is_absolute()
                  or any(part in {"", ".", ".."} for part in parsed_path.parts)
              ):
                  raise SystemExit(f"Unsafe Git tree path {path!r}")

              destination = source_directory.joinpath(*parsed_path.parts)
              destination.parent.mkdir(mode=0o700, parents=True, exist_ok=True)

              process = subprocess.Popen(
                  ["git", "cat-file", "blob", object_id],
                  stdout=subprocess.PIPE,
              )
              if process.stdout is None:
                  raise SystemExit(f"Cannot read Git blob for {path!r}")
              # Materialize executable files and symlink targets as inert regular files.
              with destination.open(mode="xb") as output:
                  shutil.copyfileobj(process.stdout, output, length=1024 * 1024)
              destination.chmod(0o600)
              process.stdout.close()
              if process.wait() != 0:
                  raise SystemExit(f"Cannot read Git blob for {path!r}")
              blob_count += 1

          if blob_count == 0:
              raise SystemExit("Reviewed tree produced an empty source directory")
          print(f"Materialized {blob_count} tracked Git blobs from {reviewed_sha}")
          PY

      - name: Black Duck SCA PR Scan
        id: black-duck-pr-scan
        if: >-
          ${{
            github.event.pull_request.head.repo.full_name == github.repository
          }}
        uses: blackduck-inc/black-duck-security-scan@152247222aa9cd38124acd5c0cf60f4db71adc3f # v2.11.0
        with:
          project_directory: ${{ runner.temp }}/blackduck-pr-source
          blackducksca_url: ${{ vars.BLACKDUCKSCA_URL }}
          blackducksca_token: ${{ secrets.BLACKDUCKSCA_TOKEN }}
          blackducksca_scan_full: false
          bridgecli_download_version: "4.5.0"
          blackducksca_scan_failure_severities: 'BLOCKER,CRITICAL'
          detect_args: "--detect.accuracy.required=NONE"

          # Black Duck SCA scans the inert source directory through its supported
          # project_directory input. It cannot comment on or mutate the pull request.
          blackducksca_prComment_enabled: false

          ### Mark build status as failure if policy violating issues are found
          mark_build_status: 'failure'
