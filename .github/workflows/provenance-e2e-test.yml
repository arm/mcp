name: Provenance attestation E2E test

on:
  push:
    branches:
      - provenance-e2e-test

env:
  TEST_IMAGE: docker.io/armlimited/arm-mcp-provenance-test
  TEST_TAG: secure-build-${{ github.run_id }}

jobs:
  build-arch-images:
    name: Build ${{ matrix.platform }}
    environment: secure-build-test
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            suffix: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            suffix: arm64

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout exact test commit
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push test image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: mcp-local/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: >-
            ${{ env.TEST_IMAGE }}:${{
              env.TEST_TAG
            }}-${{ matrix.suffix }}
          build-args: |
            EMBEDDINGS_IMAGE=armlimited/arm-mcp:embeddings-latest

  create-and-attest-manifest:
    name: Create and attest test manifest
    needs: build-arch-images
    runs-on: ubuntu-24.04
    environment: secure-build-test

    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write

    outputs:
      digest: ${{ steps.final_image_digest.outputs.digest }}
      attestation_url: ${{ steps.attest.outputs['attestation-url'] }}

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create test multi-architecture manifest
        run: |
          set -euo pipefail

          docker buildx imagetools create \
            --metadata-file "${RUNNER_TEMP}/manifest-metadata.json" \
            -t "${TEST_IMAGE}:${TEST_TAG}" \
            "${TEST_IMAGE}:${TEST_TAG}-amd64" \
            "${TEST_IMAGE}:${TEST_TAG}-arm64"

      - name: Resolve and validate final image digest
        id: final_image_digest
        run: |
          set -euo pipefail

          created_digest="$(
            jq -r \
              '."containerimage.descriptor".digest // empty' \
              "${RUNNER_TEMP}/manifest-metadata.json"
          )"

          inspected_digest="$(
            docker buildx imagetools inspect \
              "${TEST_IMAGE}:${TEST_TAG}" \
              --format '{{json .Manifest}}' |
              jq -r '.digest // empty'
          )"

          if ! printf '%s' "${created_digest}" |
            grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "::error::Created image digest is missing or invalid."
            exit 1
          fi

          if [ "${created_digest}" != "${inspected_digest}" ]; then
            echo "::error::Created and registry-resolved digests differ."
            echo "Created: ${created_digest}"
            echo "Registry: ${inspected_digest}"
            exit 1
          fi

          echo "digest=${created_digest}" >> "${GITHUB_OUTPUT}"
          echo "Resolved ${TEST_IMAGE}@${created_digest}"

      - name: Inspect multi-architecture manifest
        run: |
          set -euo pipefail

          docker buildx imagetools inspect \
            "${TEST_IMAGE}@${{ steps.final_image_digest.outputs.digest }}"

      - name: Generate and publish test provenance
        id: attest
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.TEST_IMAGE }}
          subject-digest: ${{ steps.final_image_digest.outputs.digest }}
          push-to-registry: true

      - name: Confirm attestation URL
        env:
          ATTESTATION_URL: ${{ steps.attest.outputs['attestation-url'] }}
        run: |
          set -euo pipefail

          if [ -z "${ATTESTATION_URL}" ]; then
            echo "::error::The attestation action returned no URL."
            exit 1
          fi

          echo "Attestation: ${ATTESTATION_URL}"
          echo "Digest: ${{ steps.final_image_digest.outputs.digest }}"

  verify-attestation:
    name: Verify test attestation
    needs: create-and-attest-manifest
    runs-on: ubuntu-24.04
    environment: secure-build-test
    permissions:
      contents: read
      attestations: read 

    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Verify through GitHub attestation service
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ needs.create-and-attest-manifest.outputs.digest }}
        run: |
          set -euo pipefail

          gh attestation verify \
            "oci://${TEST_IMAGE}@${DIGEST}" \
            --repo arm/mcp \
            --signer-workflow \
              arm/mcp/.github/workflows/provenance-e2e-test.yml \
            --source-ref refs/heads/provenance-e2e-test \
            --source-digest "${GITHUB_SHA}"

      - name: Verify registry-attached attestation
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ needs.create-and-attest-manifest.outputs.digest }}
        run: |
          set -euo pipefail

          gh attestation verify \
            "oci://${TEST_IMAGE}@${DIGEST}" \
            --repo arm/mcp \
            --signer-workflow \
              arm/mcp/.github/workflows/provenance-e2e-test.yml \
            --source-ref refs/heads/provenance-e2e-test \
            --source-digest "${GITHUB_SHA}" \
            --bundle-from-oci

      - name: Display complete verification result
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ needs.create-and-attest-manifest.outputs.digest }}
        run: |
          gh attestation verify \
            "oci://${TEST_IMAGE}@${DIGEST}" \
            --repo arm/mcp \
            --format json
