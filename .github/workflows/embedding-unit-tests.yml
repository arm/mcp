name: Embedding Generation Unit Tests

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'embedding-generation/**'
      - '.github/workflows/embedding-unit-tests.yml'
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  embedding-unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: embedding-generation

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.9.2'
          enable-cache: true
          cache-dependency-glob: embedding-generation/uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Run lint
        run: uv run --locked ruff check .

      - name: Run unit tests
        run: uv run --locked python -m pytest tests/ -v --tb=short
