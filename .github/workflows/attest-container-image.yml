name: Attest Container Image

on:
  workflow_call:
    inputs:
      subject-name:
        description: Fully qualified container image name without a tag
        required: true
        type: string
      subject-digest:
        description: Immutable sha256 digest of the container image
        required: true
        type: string
    secrets:
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false
    outputs:
      attestation-url:
        description: URL of the published GitHub artifact attestation
        value: ${{ jobs.attest-dockerhub.outputs.attestation-url || jobs.attest-ghcr.outputs.attestation-url }}

permissions:
  contents: read

jobs:
  validate-subject:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      registry: ${{ steps.subject.outputs.registry }}
    steps:
      - name: Validate attestation subject
        id: subject
        shell: bash
        env:
          SUBJECT_NAME: ${{ inputs.subject-name }}
          SUBJECT_DIGEST: ${{ inputs.subject-digest }}
        run: |
          set -euo pipefail
          if [[ ! "${SUBJECT_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Attestation subject digest is missing or invalid."
            exit 1
          fi
          if [[ ! "${SUBJECT_NAME}" =~ ^(docker\.io|ghcr\.io)/[^@[:space:]:]+/[^@[:space:]:]+$ ]]; then
            echo "::error::Subject must be an untagged docker.io or ghcr.io image name."
            exit 1
          fi

          registry="${SUBJECT_NAME%%/*}"
          echo "registry=${registry}" >> "${GITHUB_OUTPUT}"

  attest-dockerhub:
    needs: validate-subject
    if: ${{ needs.validate-subject.outputs.registry == 'docker.io' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    outputs:
      attestation-url: ${{ steps.attest.outputs.attestation-url }}
    steps:
      - name: Require Docker Hub credentials
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${DOCKERHUB_USERNAME}" ] || [ -z "${DOCKERHUB_TOKEN}" ]; then
            echo "::error::Docker Hub credentials are required for docker.io attestations."
            exit 1
          fi

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate and publish trusted provenance
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ inputs.subject-name }}
          subject-digest: ${{ inputs.subject-digest }}
          push-to-registry: true

      - name: Validate trusted attestation output
        env:
          ATTESTATION_URL: ${{ steps.attest.outputs.attestation-url }}
        run: |
          set -euo pipefail
          if [ -z "${ATTESTATION_URL}" ]; then
            echo "::error::Attestation action did not return an attestation URL."
            exit 1
          fi
          echo "Attestation: ${ATTESTATION_URL}" >> "${GITHUB_STEP_SUMMARY}"

  attest-ghcr:
    needs: validate-subject
    if: ${{ needs.validate-subject.outputs.registry == 'ghcr.io' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    outputs:
      attestation-url: ${{ steps.attest.outputs.attestation-url }}
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Generate and publish trusted provenance
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ inputs.subject-name }}
          subject-digest: ${{ inputs.subject-digest }}
          push-to-registry: true

      - name: Validate trusted attestation output
        env:
          ATTESTATION_URL: ${{ steps.attest.outputs.attestation-url }}
        run: |
          set -euo pipefail
          if [ -z "${ATTESTATION_URL}" ]; then
            echo "::error::Attestation action did not return an attestation URL."
            exit 1
          fi
          echo "Attestation: ${ATTESTATION_URL}" >> "${GITHUB_STEP_SUMMARY}"
