[project]
name = "arm-kb-search"
version = "0.3.0"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "rank-bm25",
  "sentence-transformers>=6.0.1",
  "usearch==2.26.2",
  "numkong==7.8.2",
]

[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["arm_kb_search*"]
